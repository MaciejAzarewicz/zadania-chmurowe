events {}

http {
  proxy_cache_path /tmp/cache levels=1:2 keys_zone=mycache:10m;

  upstream backend_up {
    server api-a:3000;
    server api-b:3000;
  }

  server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # /api/stats z cache
    location /api/stats {
      proxy_pass http://backend_up/stats;
      proxy_cache mycache;
      proxy_cache_valid 200 30s;
      add_header X-Cache-Status $upstream_cache_status;
    }

    # wszystkie pozostałe /api/ kierujemy do load balancera
    location /api/ {
      proxy_pass http://backend_up/;
    }

    # SPA fallback
    location / {
      try_files $uri /index.html;
    }
  }
}